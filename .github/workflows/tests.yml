name: portable-tests

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Portable harness
        run: python tests/harness.py
      - name: Canonical checklist reference
        run: python scripts/validate.py --check-reference
